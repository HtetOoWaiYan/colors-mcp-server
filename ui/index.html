<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colors viewer</title>
<style>
:root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1c22; --muted: #5b6070; --line: #d8dbe3; --card: #f6f7fa; --ok: #0f7b3d; --bad: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg: #14161b; --fg: #eceef3; --muted: #a2a8b8; --line: #2c3038; --card: #1c1f26; --ok: #5fd08a; --bad: #ff8a80; } }
:root[data-theme="light"] { --bg: #ffffff; --fg: #1a1c22; --muted: #5b6070; --line: #d8dbe3; --card: #f6f7fa; --ok: #0f7b3d; --bad: #b3261e; }
:root[data-theme="dark"] { --bg: #14161b; --fg: #eceef3; --muted: #a2a8b8; --line: #2c3038; --card: #1c1f26; --ok: #5fd08a; --bad: #ff8a80; }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
h1 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 8px 0; }
.sw { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); flex: none; }
.strip { display: flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.strip div { flex: 1; min-height: 56px; display: flex; align-items: flex-end; padding: 4px; font-size: 10px; font-family: ui-monospace, monospace; }
.badge { font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
.sample { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); font-size: 16px; }
code { font-family: ui-monospace, monospace; font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.tok { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.tok .sw { width: 26px; height: 26px; }
input[type=color] { width: 36px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
button { font: inherit; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
</style>
</head>
<body>
<div id="app"><p class="muted">Waiting for a color result…</p></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
